name: Deploy to Firebase Hosting on PR

on:
  pull_request:
    branches:
      - main

# Declare default permissions as read only
permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  build_and_preview:
    name: Build and deploy preview
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          # Mesma versão usada pelo upstream em .github/workflows/docs.yml.
          sdk: 3.14.0-315.3.beta

      - name: Fetch Dart dependencies
        run: dart pub get

      - name: Build site
        run: dart run dash_site --site=docs build

      - name: Deploy to Firebase Hosting Preview Channel
        id: firebase-deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRANSLITERADU }}
          projectId: transliteradu
          channelId: pr-${{ github.event.pull_request.number }}
          expires: 7d
          target: docs-flutterbrasil
          entryPoint: sites/docs

      - name: Comentar PR com link de preview
        # Mantém um único comentário por PR: na primeira vez cria, nos pushes
        # seguintes só edita o mesmo comentário (sem notificar de novo).
        uses: actions/github-script@v7
        if: steps.firebase-deploy.outputs.details_url
        env:
          PREVIEW_URL: ${{ steps.firebase-deploy.outputs.details_url }}
        with:
          script: |
            const marcador = '<!-- preview-flutterbrasil -->';
            const previewUrl = process.env.PREVIEW_URL;
            const sha = context.payload.pull_request.head.sha.substring(0, 7);
            const body = `${marcador}
            ## 🚀 Preview da Documentação do Flutter Brasil

            🔗 **Visualizar preview:** ${previewUrl}

            Atualizado para o commit \`${sha}\`. Este comentário é editado a cada
            novo commit no PR; o preview expira em 7 dias.

            📚 **Site oficial:** [docs.flutterbrasil.dev](https://docs.flutterbrasil.dev)`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comentarios = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existente = comentarios.find(
              (c) => c.user.type === 'Bot' && c.body.includes(marcador),
            );
            if (existente) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existente.id, body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
