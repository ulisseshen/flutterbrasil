name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

# Declare default permissions as read only
permissions:
  contents: read
  checks: write

jobs:
  linkcheck:
    name: Build site and check links
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          # Mesma versão usada pelo upstream em .github/workflows/docs.yml.
          sdk: 3.14.0-315.3.beta

      - name: Fetch Dart dependencies
        run: dart pub get

      - name: Install firebase-tools
        run: curl -sL https://firebase.tools | bash

      - name: Build site
        run: dart run dash_site --site=docs build

      - name: Check for broken Markdown link references
        run: dart run dash_site --site=docs check-link-references

      - name: Check for broken internal links
        run: dart run dash_site --site=docs check-links

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: sites/docs/build/jaspr
          retention-days: 1

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: linkcheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: sites/docs/build/jaspr

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRANSLITERADU }}
          projectId: transliteradu
          channelId: live
          target: docs-flutterbrasil
          entryPoint: sites/docs
