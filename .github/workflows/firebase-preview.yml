name: Deploy to Firebase Hosting on PR

on:
  pull_request:
    branches:
      - main

# Declare default permissions as read only
permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  build_and_preview:
    name: Build and deploy preview
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          # Mesma versão usada pelo upstream em .github/workflows/docs.yml.
          sdk: 3.14.0-315.3.beta

      - name: Fetch Dart dependencies
        run: dart pub get

      - name: Build site
        run: dart run dash_site --site=docs build

      - name: Deploy to Firebase Hosting Preview Channel
        id: firebase-deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRANSLITERADU }}
          projectId: transliteradu
          channelId: pr-${{ github.event.pull_request.number }}
          expires: 7d
          target: docs-flutterbrasil
          entryPoint: sites/docs

      - name: Comentar PR com link de preview
        uses: actions/github-script@v7
        if: steps.firebase-deploy.outputs.details_url
        env:
          PREVIEW_URL: ${{ steps.firebase-deploy.outputs.details_url }}
        with:
          script: |
            const previewUrl = process.env.PREVIEW_URL;
            const comment = `## 🚀 Preview da Documentação do Flutter Brasil

            ✅ **Deploy de preview disponível!**

            Esta é uma visualização prévia das alterações na documentação oficial do Flutter Brasil.

            🔗 **Visualizar preview:** ${previewUrl}

            📚 **Site oficial:** [docs.flutterbrasil.dev](https://docs.flutterbrasil.dev)

            ---

            ⏰ Este preview expira em 7 dias
            🔄 O preview será atualizado automaticamente a cada novo commit neste PR

            *Documentação do Flutter em Português do Brasil*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      # As checagens de link rodam depois do deploy: o preview continua
      # disponível para revisão, mas o PR fica vermelho se houver link quebrado
      # (o mesmo check que roda no deploy de produção, antes do merge).
      - name: Install firebase-tools
        # Mesma versão fixada pelo upstream em .github/workflows/docs.yml.
        env:
          FIREBASE_TOOLS_VERSION: 15.30.2
        run: |
          sudo curl -sSfLo /usr/local/bin/firebase \
            "https://firebase.tools/bin/linux/v${FIREBASE_TOOLS_VERSION}"
          sudo chmod +rx /usr/local/bin/firebase
          firebase --version

      - name: Check for broken Markdown link references
        run: dart run dash_site --site=docs check-link-references

      - name: Check for broken internal links
        run: dart run dash_site --site=docs check-links
